[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icc-ml"
version = "1.0.0"
description = "ML meta-labeling layer for the ICC Swing trading strategy"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3.14b",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
boost = ["lightgbm>=4.0", "xgboost>=2.0"]
notebook = ["jupyter", "ipykernel", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]
